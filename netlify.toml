# Cấu hình triển khai GYY trên Netlify.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Các biến VITE_* là cấu hình công khai theo thiết kế (nằm trong mã frontend); không để trình quét bí mật của Netlify làm hỏng bản build.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_AI_ENDPOINT,VITE_TTS_ENDPOINT"

# Chuyển hướng /api/* và quy tắc SPA nằm ở public/_redirects (được copy vào dist khi build).

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/dict/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Chạy thử cục bộ bằng Netlify CLI: phục vụ thư mục dist đã build kèm các hàm và quy tắc chuyển hướng.
[dev]
  framework = "#static"
  publish = "dist"
  port = 8888
